function render(){
 const q=document.getElementById('buscar').value.toLowerCase(); const tb=document.getElementById('tabla'); tb.innerHTML='';
 invitados.filter(i=>(i.nombre||'').toLowerCase().includes(q)||String(i.id).includes(q)).forEach(i=>{
  const pase=Number(i.personas)>0?(Number(i.personas)==1?'1 Persona':i.personas+' Personas'):'';
  const tr=document.createElement('tr');
  tr.innerHTML='<td>'+i.id+'</td><td><strong>'+esc(i.nombre)+'</strong></td><td>'+i.personas+'</td><td><a href="'+url(i)+'" target="_blank">Abrir invitación</a></td><td><button onclick="copiar('+i.id+')">📋 Copiar</button><button class="alt" onclick="wa('+i.id+')">💬 WhatsApp</button></td><td><textarea class="msg" readonly>'+esc(pase?mensaje(i):mensaje(i))+'</textarea></td>';

 });
}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

function wa(id){const i=invitados.find(x=>x.id==id);location.href='https://wa.me/?text='+encodeURIComponent(mensaje(i));}

 const f=document.getElementById('excel').files[0]; if(!f){alert('Selecciona un archivo Excel.');return;}
 const rd=new FileReader(); rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const a=XLSX.utils.sheet_to_json(ws,{defval:''});

}
function descargarJSON(){const b=new Blob([JSON.stringify(invitados,null,2)],{type:'application/json'});descargar(b,'invitados.json');}
function descargarXLSX(){const a=invitados.map(i=>({'No.':i.id,'Nombre':i.nombre,'Cantidad':i.personas,'Pase':Number(i.personas)>0?(Number(i.personas)==1?'1 Persona':i.personas+' Personas'):'','Enlace':url(i),'Mensaje WhatsApp':mensaje(i)}));const ws=XLSX.utils.json_to_sheet(a);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Invitados');XLSX.writeFile(wb,'Listado_Invitados_Enlaces.xlsx');}
function descargar(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
