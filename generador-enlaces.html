<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de Enlaces | Alejandro & Katherin</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --verde:#315442;
  --dorado:#aa8a4e;
  --fondo:#f5f2eb;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:var(--fondo);
  color:#333;
  line-height:1.45;
}

.wrap{
  width:min(1200px,100%);
  margin:0 auto;
  padding:24px 16px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 30px #0001;
  margin-bottom:20px;
}

h1{
  margin:0 0 8px;
  color:var(--verde);
  font-size:clamp(24px,4vw,34px);
}

h2{
  color:var(--verde);
}

p{
  overflow-wrap:anywhere;
}

input[type=file],
input[type=text]{
  width:100%;
  max-width:520px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  background:#fff;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  margin:4px;
  cursor:pointer;
  background:var(--verde);
  color:white;
  font-size:14px;
  transition:.2s;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

button.alt{
  background:var(--dorado);
}

button.danger{
  background:#a33;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#eef7ef;
  margin:12px 0;
  overflow-wrap:anywhere;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.search{
  margin:0 0 15px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:12px;
}

table{
  width:100%;
  min-width:1050px;
  border-collapse:collapse;
  background:white;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top;
}

th{
  background:var(--verde);
  color:white;
  position:sticky;
  top:0;
  z-index:1;
}

td a{
  color:var(--verde);
  font-weight:600;
  overflow-wrap:anywhere;
}

.msg{
  width:300px;
  min-width:260px;
  height:110px;
  resize:vertical;
  padding:8px;
  border:1px solid #ddd;
  border-radius:8px;
}

.small-note{
  font-size:13px;
  color:#666;
}

/* =========================================
   TARJETAS PARA CELULAR
========================================= */

.cards-mobile{
  display:none;
}

.invitado-card{
  background:#fff;
  border:1px solid #e6e1d8;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 18px #00000010;
}

.invitado-numero{
  font-size:12px;
  color:#777;
  margin-bottom:5px;
}

.invitado-nombre{
  color:var(--verde);
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
  overflow-wrap:anywhere;
}

.invitado-dato{
  background:#f8f6f1;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:10px;
}

.invitado-dato strong{
  display:block;
  color:#555;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin-bottom:3px;
}

.enlace-personalizado{
  display:block;
  color:var(--verde);
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.mensaje-label{
  font-size:13px;
  font-weight:bold;
  color:#555;
  margin:12px 0 5px;
}

.msg-mobile{
  width:100%;
  min-height:150px;
  resize:vertical;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:Arial,sans-serif;
  font-size:13px;
  line-height:1.45;
  background:#fafafa;
}

.botones-mobile{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.botones-mobile button{
  width:100%;
  margin:0;
  padding:12px 8px;
}

.btn-abrir{
  background:var(--verde);
}

.btn-copiar{
  background:#555;
}

.btn-whatsapp{
  background:#aa8a4e;
}

.btn-copiar-mensaje{
  background:#777;
  grid-column:1 / -1;
}


/* =========================================
   TABLET / CELULAR
========================================= */

@media(max-width:768px){

  .wrap{
    padding:14px 10px;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .actions button{
    width:100%;
    margin:0;
  }

  .search{
    margin-bottom:12px;
  }

  .status{
    font-size:14px;
  }

  /* Ocultar tabla en móvil */
  .table-wrap{
    display:none;
  }

  /* Mostrar tarjetas */
  .cards-mobile{
    display:block;
  }

}

@media(max-width:480px){

  .wrap{
    padding:10px 7px;
  }

  .card{
    padding:13px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  button{
    font-size:14px;
    padding:12px;
  }

  input[type=file],
  input[type=text]{
    max-width:none;
  }

  .invitado-card{
    padding:14px;
    border-radius:14px;
  }

  .invitado-nombre{
    font-size:18px;
  }

  .botones-mobile{
    grid-template-columns:1fr;
  }

  .btn-copiar-mensaje{
    grid-column:auto;
  }

}
</style>
</head>

<div class="wrap">

  <div class="card">

    <h1>💍 Generador de Enlaces — Alejandro & Katherin</h1>

        <thead>

            <th>Cantidad</th>

    <!-- =====================================
         VISTA CELULAR

    <div

      class="cards-mobile"
      style="margin-top:15px"

  </div>

</div>

const KEY="listaInvitadosAlejandroKatherin";


function guardar(){

  localStorage.setItem(
    KEY,
    JSON.stringify(invitados)
  );

  document.getElementById('estado').textContent=
    '✅ Lista guardada en este navegador: '+
    invitados.length+
    ' invitados.';

}


function cargarGuardada(){

  try{

    const x=localStorage.getItem(KEY);

    if(x){

      invitados=JSON.parse(x);

      document.getElementById('estado').textContent=
        '✅ Lista guardada recuperada: '+
        invitados.length+
        ' invitados.';

    }

  }catch(e){}

}


function actualizarTotal(){

  document.getElementById('totalInvitados').textContent=
    invitados.length+
    (invitados.length===1?' invitado':' invitados');

}


function url(i){

  return BASE+
    '?invitado='+
    encodeURIComponent(i.id);

}


function mensaje(i){

  return '💍❤️ ¡Hola, '+i.nombre+'!\n\n'+
  'Con mucho cariño, Alejandro y Katherin queremos compartir contigo nuestra invitación de boda. ❤️\n\n'+
  '✨ Aquí tienes tu invitación personalizada:\n'+
  url(i)+
  '\n\n'+
  'Será un honor contar con tu presencia en este día tan especial. 🥂✨\n\n'+
  '¡Te esperamos! ❤️';

}


function paseTexto(i){

  const cantidad=Number(i.personas)||0;

  if(cantidad<=0){

    return '0';

  }

  return cantidad===1
    ?'1 Persona'
    :cantidad+' Personas';

}


function render(){

  const q=
    document
    .getElementById('buscar')
    .value
    .toLowerCase()
    .trim();

  const lista=
    invitados.filter(i=>
      (i.nombre||'')
      .toLowerCase()
      .includes(q)
      ||
      String(i.id).includes(q)
    );


  /* ====================================
     TABLA COMPUTADORA
  ==================================== */

  const tb=
    document.getElementById('tabla');

  tb.innerHTML='';


  lista.forEach(i=>{

    const tr=
      document.createElement('tr');

    tr.innerHTML=

      '<td>'+
        i.id+
      '</td>'+

      '<td>'+
        '<strong>'+
          esc(i.nombre)+
        '</strong>'+
      '</td>'+

      '<td>'+
        paseTexto(i)+
      '</td>'+

      '<td>'+
        '<a href="'+
          url(i)+
          '" target="_blank">'+
          'Abrir invitación'+
        '</a>'+
      '</td>'+

      '<td>'+
        '<button onclick="copiar('+i.id+')">'+
          '📋 Copiar'+
        '</button>'+

        '<button class="alt" onclick="wa('+i.id+')">'+
          '💬 WhatsApp'+
        '</button>'+
      '</td>'+

      '<td>'+
        '<textarea class="msg" readonly>'+
          esc(mensaje(i))+
        '</textarea>'+
      '</td>';

    tb.appendChild(tr);

  });


  /* ====================================
     TARJETAS CELULAR
  ==================================== */

  const cards=
    document.getElementById('cardsMobile');

  cards.innerHTML='';


  if(lista.length===0){

    cards.innerHTML=
      '<div class="invitado-card">'+
        '<div class="invitado-nombre">'+
          '🔎 No se encontraron invitados'+
        '</div>'+
        '<div class="small-note">'+
          'Prueba con otro nombre o número.'+
        '</div>'+
      '</div>';

    actualizarTotal();

    return;

  }


  lista.forEach(i=>{

    const card=
      document.createElement('div');

    card.className='invitado-card';

    card.innerHTML=

      '<div class="invitado-numero">'+
        'INVITADO #'+
        i.id+
      '</div>'+

      '<div class="invitado-nombre">'+
        esc(i.nombre)+
      '</div>'+

      '<div class="invitado-dato">'+
        '<strong>👤 Cantidad</strong>'+
        paseTexto(i)+
      '</div>'+

      '<div class="invitado-dato">'+
        '<strong>🔗 Enlace personalizado</strong>'+
        '<span class="enlace-personalizado">'+
          esc(url(i))+
        '</span>'+
      '</div>'+

      '<div class="mensaje-label">'+
        '💬 Mensaje para WhatsApp'+
      '</div>'+

      '<textarea id="mensaje-'+
        i.id+
        '" class="msg-mobile" readonly>'+
        esc(mensaje(i))+
      '</textarea>'+

      '<div class="botones-mobile">'+

        '<button class="btn-abrir" onclick="abrir('+i.id+')">'+
          '🔗 Abrir invitación'+
        '</button>'+

        '<button class="btn-copiar" onclick="copiar('+i.id+')">'+
          '📋 Copiar enlace'+
        '</button>'+

        '<button class="btn-whatsapp" onclick="wa('+i.id+')">'+
          '💬 Enviar por WhatsApp'+
        '</button>'+

        '<button class="btn-copiar-mensaje" onclick="copiarMensaje('+i.id+')">'+
          '📋 Copiar mensaje'+
        '</button>'+

      '</div>';

    cards.appendChild(card);

  });


  actualizarTotal();

}


function esc(s){

  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}


async function copiar(id){

  const i=
    invitados.find(x=>x.id==id);

  if(!i)return;

  try{

    await navigator.clipboard.writeText(
      url(i)
    );

    alert('✅ Enlace copiado.');

  }catch(e){

    alert('No se pudo copiar automáticamente. Puedes copiar el enlace manualmente.');

  }

}


async function copiarMensaje(id){

  const i=
    invitados.find(x=>x.id==id);

  if(!i)return;

  try{

    await navigator.clipboard.writeText(
      mensaje(i)
    );

    alert('✅ Mensaje de WhatsApp copiado.');

  }catch(e){

    const textarea=
      document.getElementById(
        'mensaje-'+id
      );

    if(textarea){

      textarea.select();
      document.execCommand('copy');

      alert('✅ Mensaje copiado.');

    }

  }

}


function abrir(id){

  const i=
    invitados.find(x=>x.id==id);

  if(!i)return;

  window.open(
    url(i),
    '_blank'
  );

}


function wa(id){

  const i=
    invitados.find(x=>x.id==id);

  if(!i)return;

  location.href=
    'https://wa.me/?text='+
    encodeURIComponent(
      mensaje(i)
    );

}


function importarExcel(){

  const f=
    document
    .getElementById('excel')
    .files[0];

  if(!f){

    alert(
      'Selecciona un archivo Excel.'
    );

    return;

  }


  const rd=
    new FileReader();


  rd.onload=e=>{

    try{

      const wb=
        XLSX.read(
          e.target.result,
          {type:'array'}
        );

      const ws=
        wb.Sheets[
          wb.SheetNames[0]
        ];

      const a=
        XLSX.utils.sheet_to_json(
          ws,
          {defval:''}
        );


      invitados=
        a.map(
          (r,idx)=>({

            id:
              Number(r['No.'])||
              idx+1,

            nombre:
              String(
                r['Nombre']||
                ''
              ).trim(),

            personas:
              Number(
                r['Cantidad']
              )||0

          })
        );


      guardar();
      render();


      alert(
        'Excel importado: '+
        invitados.length+
        ' invitados.'
      );


    }catch(err){

      alert(
        'No se pudo leer el Excel: '+
        err.message
      );

    }

  };


  rd.readAsArrayBuffer(f);

}


function descargarJSON(){

  const b=
    new Blob(
      [
        JSON.stringify(
          invitados,
          null,
          2
        )
      ],
      {
        type:
          'application/json'
      }
    );

  descargar(
    b,
    'invitados.json'
  );

}


function descargarXLSX(){

  const a=
    invitados.map(i=>({

      'No.':
        i.id,

      'Nombre':
        i.nombre,

      'Cantidad':
        i.personas,

      'Pase':
        paseTexto(i),

      'Enlace':
        url(i),

      'Mensaje WhatsApp':
        mensaje(i)

    }));


  const ws=
    XLSX.utils.json_to_sheet(a);


  const wb=
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    wb,
    ws,
    'Invitados'
  );


  XLSX.writeFile(
    wb,
    'Listado_Invitados_Enlaces.xlsx'
  );

}


function descargar(b,n){

  const a=
    document.createElement('a');

  a.href=
    URL.createObjectURL(b);

  a.download=n;

  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        a.href
      );
    },
    1000
  );

}


function limpiar(){

  if(
    confirm(
      '¿Borrar la lista guardada de este navegador?'
    )
  ){

    localStorage.removeItem(KEY);

    location.reload();

  }

}


cargarGuardada();
render();

</script>
